<!DOCTYPE html>
<!-- saved from url=(0012)about:srcdoc -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Exercise template</title>
  <style>
    body {
        font-family: Arial, sans-serif; /* Pridanie bezpätkového písma */
    }
    table {
        border-collapse: collapse;
    }
    td, th {
        border: 1px solid black;
        padding: 10px 40px;
        text-align: center; /* Zarovnanie všetkého textu na stred */
    }
    tr:nth-child(even) { /* Zmena na párne riadky */
        background-color: #f2f2f2;
    }
  </style>
</head>
<body>
<table>
    <tbody><tr>
        <th style="background: #add8e6">Name</th>
        <th style="background: #add8e6">Role</th>
        <th style="background: #add8e6">Status</th>
    </tr>
    <tr>
        <td>Alice</td>
        <td><i>Developer</i></td>
        <td style="color: green;"><b>Active</b></td>
    </tr>
    <tr>
        <td>Bob</td>
        <td><b>Designer</b></td>
        <td style="color: red">Inactive</td>
    </tr>
    <tr>
        <td>Carol</td>
        <td><u>Manager</u></td> <!-- Pridaná modrá farba -->
        <td style="background: yellow">On Leave</td>
    </tr>
</tbody></table>

</body></html>
