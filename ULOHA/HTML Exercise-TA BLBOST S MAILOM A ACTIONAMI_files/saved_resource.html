<!DOCTYPE html>
<!-- saved from url=(0012)about:srcdoc -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <title>Exercise template</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .background {
      display: flex;
      align-items: center;
      width: 1100px;
      height: 350px;
      background-color: #ff3035;
      padding: 13px;
      box-sizing: border-box;
      gap: 13px;
      border: 2px solid white;
    }

    .photo {
      background-color: black;
      width: 175px;
      height: 320px;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border: 2px solid white;
      box-sizing: border-box;
      flex-shrink: 0;
    }

    .right-column {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      height: 320px;
      background-color: black;
      padding: 13px;
      box-sizing: border-box;
      border: 2px solid white;
    }

    .background2 {
      background-color: #ff3035;
      height: 88px;
      padding: 13px;
      box-sizing: border-box;
      display: flex;
      gap: 13px;
      border: 2px solid white;
    }

    .email-background {
      background-color: #ff3035;
      height: 88px;
      padding: 13px;
      box-sizing: border-box;
      display: flex;
      border: 2px solid white;
    }

    .email {
      background-color: #ff3035;
      flex-grow: 1;
      color: white;
      padding: 10px;
      box-sizing: border-box;
      font-size: 16px;
      font-weight: bold;
      display: flex;
      align-items: center;
      border: 2px solid white;
    }

    .opt-box {
      background-color: black;
      color: white;
      width: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid white;
      flex-shrink: 0;
    }

    .actions-row {
      display: flex;
      gap: 20px;
      height: 88px;
      background-color: #ff3035;
      padding: 13px;
      box-sizing: border-box;
      border: 2px solid white;
    }

    .action-btn {
      background-color: #111111;
      color: white;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 16px;
      font-weight: bold;
      border: 2px solid white;
    }
  </style>
</head>
<body>
  <div class="background">
    <div class="photo">FOTO</div>

    <div class="right-column">

      <div class="background2">
        <div class="email" style="background-color: #111111;">
          MENO.PRIEZVISKO@HANDLE
        </div>
        <div class="opt-box">Opt</div>
      </div>

      <div class="email-background">
        <div class="email">
          TEXT MESSAGE
        </div>
      </div>

      <div class="actions-row">
        <div class="action-btn">ACTION 1</div>
        <div class="action-btn">ACTION 2</div>
        <div class="action-btn">ACTION 3</div>
        <div class="action-btn">ACTION 4</div>
        <div class="action-btn">ACTION 5</div>
      </div>

    </div>
  </div>

</body></html>
