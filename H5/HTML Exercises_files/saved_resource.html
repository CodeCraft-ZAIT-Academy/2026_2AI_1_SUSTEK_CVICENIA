<!DOCTYPE html>
<!-- saved from url=(0012)about:srcdoc -->
<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <style>
    .background {
      display: flex;
      align-items: center;
      width: 800px;
      height: 250px;
      background-color: red;
      padding: 15px;
      box-sizing: border-box;
      gap: 15px; /* Automatická medzera medzi prvkami */
    }
    
    .photo {
      background-color: black;
      width: 150px;
      height: 220px;
    }

    /* Pravý stĺpec, ktorý drží veci pod sebou */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 15px; /* Medzera medzi riadkami vpravo */
      flex-grow: 1;
      height: 220px;
    }

    .background2 {
      background-color: black;
      height: 100px;
    }

    .email-background {
      background-color: black; /* Prípadne red, podľa toho čo tam chcete */
      height: 105px;
    }
  </style>
  <title>Exercise template</title>
</head>
<body>
  <div class="background">
    <div class="photo"></div>
    <div class="right-column">
      <div class="background2"></div>
      <div class="email-background"></div>
    </div>
  </div>

</body></html>
